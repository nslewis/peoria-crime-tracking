<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peoria Crime Tracker</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Heat -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- App CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav" id="main-nav">
        <div class="nav-brand">
            <span class="nav-logo">&#9679;</span>
            <span class="nav-title">PEORIA CRIME TRACKER</span>
        </div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="#dashboard" class="nav-link active" data-page="dashboard">Dashboard</a></li>
            <li><a href="#streets" class="nav-link" data-page="streets">Street Search</a></li>
            <li><a href="#explore" class="nav-link" data-page="explore">Explore</a></li>
            <li><a href="#trends" class="nav-link" data-page="trends">Trends</a></li>
            <li><a href="#sync" class="nav-link" data-page="sync">Data Sync</a></li>
        </ul>
    </nav>

    <!-- Main content -->
    <main class="main" id="app-content">
        <div class="loading-screen">
            <div class="loading-pulse"></div>
            <p>Loading crime data...</p>
        </div>
    </main>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- App entry -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
